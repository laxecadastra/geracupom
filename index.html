<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0204" />
    <title>Gerador de imagem do vendedor | Reserva</title>
    <meta
      name="description"
      content="Crie em segundos sua imagem com o seu código de vendedor e mande no WhatsApp. Modelos Reserva, Reserva Mini e Reserva Go."
    />
    <link rel="canonical" href="https://geracupom.vercel.app/" />

    <!-- prévia do link (WhatsApp, Instagram, Facebook, LinkedIn): a imagem precisa de URL absoluta -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Reserva" />
    <meta property="og:title" content="Gerador de imagem do vendedor | Reserva" />
    <meta property="og:description" content="Crie sua imagem com o seu código de vendedor e mande no WhatsApp ou salve no celular." />
    <meta property="og:url" content="https://geracupom.vercel.app/" />
    <meta property="og:image" content="https://geracupom.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://geracupom.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reserva: modelos de imagem com o código do vendedor" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gerador de imagem do vendedor | Reserva" />
    <meta name="twitter:description" content="Crie sua imagem com o seu código de vendedor e mande no WhatsApp ou salve no celular." />
    <meta name="twitter:image" content="https://geracupom.vercel.app/og-image.jpg" />

    <!-- ícones -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- interface: Fraunces (títulos) + Manrope, as fontes da Reserva; artes (canvas): as demais -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Anton&family=Archivo+Black&family=Baloo+2:wght@800&family=Bebas+Neue&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <svg class="top-logo" id="top-logo" viewBox="0 0 28 32" aria-hidden="true"></svg>
      <span class="top-title">Reserva</span>
    </header>

    <main class="layout">
      <div class="controls">
        <div class="intro">
          <h1>Sua imagem com o seu código de vendedor.</h1>
          <p class="sub">Digite o código, escolha o modelo e mande no WhatsApp ou salve no celular.</p>
        </div>

        <!-- 1. código do vendedor -->
        <section class="step" aria-labelledby="step-1">
          <h2 class="step-title" id="step-1"><span class="step-n" aria-hidden="true">1</span>Seu código</h2>

          <div class="tag-wrap">
            <svg class="tag-string" viewBox="0 0 80 120" aria-hidden="true">
              <path d="M44 118 C 30 90, 6 70, 14 38 C 20 14, 50 6, 74 2" />
            </svg>
            <label class="tag" for="code">
              <span class="tag-label">Código do vendedor</span>
              <input
                id="code"
                class="code-input"
                inputmode="text"
                autocapitalize="characters"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                maxlength="12"
                placeholder="RSV1234"
                aria-describedby="code-hint"
              />
              <small id="code-hint" class="hint" aria-live="polite"></small>
            </label>
          </div>

          <div class="field" id="campo-genero">
            <span class="label" id="lbl-genero">Na imagem, escrever:</span>
            <div class="seg seg-3" role="radiogroup" aria-labelledby="lbl-genero">
              <button type="button" role="radio" data-genero="vendedora">de vendedora</button>
              <button type="button" role="radio" data-genero="vendedor">de vendedor</button>
              <button type="button" role="radio" data-genero="neutro">exclusivo</button>
            </div>
          </div>
        </section>

        <!-- 2. modelo -->
        <section class="step" aria-labelledby="step-2">
          <h2 class="step-title" id="step-2"><span class="step-n" aria-hidden="true">2</span>Escolha o modelo</h2>
          <div class="tabs" id="marcas" role="tablist" aria-labelledby="step-2"></div>
          <div id="thumbs" class="thumbs" role="tabpanel"></div>

          <div class="field" id="campo-formato">
            <span class="label" id="lbl-formato">Formato</span>
            <div class="seg" role="radiogroup" aria-labelledby="lbl-formato">
              <button type="button" role="radio" data-formato="feed">Post <small>4:5</small></button>
              <button type="button" role="radio" data-formato="status">Status <small>9:16</small></button>
            </div>
          </div>
        </section>

        <!-- 3. opcionais -->
        <section class="step" aria-labelledby="step-3">
          <h2 class="step-title" id="step-3"><span class="step-n" aria-hidden="true">3</span>Se quiser, personalize</h2>

          <details class="panel" id="mais">
            <summary>Colocar meu nome e loja</summary>
            <div class="panel-body">
              <label class="field">
                <span class="label">Seu nome</span>
                <input id="nome" maxlength="40" autocomplete="given-name" placeholder="Ex.: Ana" />
              </label>
              <label class="field">
                <span class="label">Loja</span>
                <input id="loja" maxlength="40" placeholder="Ex.: Reserva Shopping Leblon" />
              </label>
            </div>
          </details>

          <div class="panel link-panel">
            <label class="check">
              <input type="checkbox" id="link-on" checked />
              <span>Mandar o link do site com o código já aplicado</span>
            </label>
            <div id="link-body" class="panel-body">
              <label class="field">
                <span class="label">Página do site (opcional)</span>
                <input id="link-page" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Cole um link do usereserva.com" />
              </label>
              <div class="link-out">
                <code id="link-final"></code>
                <button id="link-copy" type="button" class="btn-mini">Copiar link</button>
              </div>
              <small id="link-hint" class="hint" aria-live="polite"></small>
            </div>
          </div>
        </section>
      </div>

      <section class="preview-col" id="preview-box" aria-label="Prévia">
        <div class="preview-frame">
          <canvas id="preview" aria-label="Prévia da imagem"></canvas>
          <div class="loading">Carregando modelos…</div>
        </div>
        <div class="actions">
          <button id="share" class="btn btn-wa" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
            <span><span class="long">Compartilhar no </span>WhatsApp</span>
          </button>
          <button id="download" class="btn btn-ghost" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16"/></svg>
            <span>Salvar<span class="long"> imagem</span></span>
          </button>
        </div>
        <button id="copy" class="link" type="button" disabled>Copiar a mensagem para mandar junto</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/logo.js"></script>
    <script src="js/marcas.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api-templates.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
